name: Bug report
description: Report a reproducible Agents Go bug.
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check whether the issue already exists. For contribution guidance, read [CONTRIBUTING.md](https://github.com/zhangxq0606-ctrl/agents-go/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: current-behavior
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the shortest steps or commands that reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Agents Go version:
        - Operating system:
        - Terminal:
        - Shell, if relevant:
    validations:
      required: true
